targetNamespace: ''
parameters: {}
environment: {}
packages:
  - name: postcard
    environment:
      POSTCARD_FUNCTION_SECRET: '${POSTCARD_FUNCTION_SECRET}'
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      SPACES_KEY: '${SPACES_KEY}'
      SPACES_SECRET: '${SPACES_SECRET}'
      SPACES_BUCKET: 'mypreflight-postcards'
      SPACES_REGION: 'fra1'
      SPACES_PREFIX: 'postcards/'
      SPACES_ACL: 'public-read'
    functions:
      - name: city
        runtime: 'nodejs:24'
        main: main
        web: true
        webSecure: '${POSTCARD_FUNCTION_SECRET}'
        limits:
          timeout: 300000
          memory: 512
