services:
  app:
    build:
      context: .
      target: development
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - '3001:3000'
    healthcheck:
      test: 'curl --fail http://localhost:3000/health || exit 1'
      interval: 500ms
      retries: 3600
      start_period: 3s
      timeout: 500ms

  openai-mock:
    image: mockserver/mockserver:mockserver-9.4.0@sha256:b54cb4aa72605b43ff9b728e5750d7beceb8f2d203d77ad9cb47743c5446ded6
    ports:
      - '1180:1080'
    volumes:
      - ./docker/mock:/config
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/openai.json
